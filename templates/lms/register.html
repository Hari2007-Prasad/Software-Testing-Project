{% extends "lms/base_lms.html" %}

{% block title %}Student Registration{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="bg-white p-4 p-sm-5 rounded-4 border shadow-sm">
                <div class="text-center mb-4">
                    <div class="lms-brand-icon mx-auto mb-3" style="width: 48px; height: 48px; font-size: 1.3rem;">
                        <i class="fa-solid fa-graduation-cap"></i>
                    </div>
                    <h4 class="fw-bold text-dark mb-1">Student Registration</h4>
                    <p class="text-secondary small">Enroll in technical tracks and specialized certifications</p>
                </div>

                <form method="POST" action="{{ url_for('lms.register') }}">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>

                    <div class="mb-3">
                        <label class="form-label small fw-bold text-secondary">Full Name *</label>
                        <input type="text" name="full_name" class="form-control" placeholder="Alex Rivera" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-bold text-secondary">Username *</label>
                        <input type="text" name="username" class="form-control" placeholder="alexr" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-bold text-secondary">Academic Email *</label>
                        <input type="email" name="email" class="form-control" placeholder="alex@digitallearn.edu" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-bold text-secondary">Password *</label>
                        <input type="password" name="password" class="form-control" placeholder="••••••••" required minlength="6">
                    </div>

                    <div class="mb-4">
                        <label class="form-label small fw-bold text-secondary">Confirm Password *</label>
                        <input type="password" name="confirm_password" class="form-control" placeholder="••••••••" required minlength="6">
                    </div>

                    <button type="submit" class="btn btn-primary w-100 py-2 rounded-pill shadow-sm fw-semibold">
                        <i class="fa-solid fa-user-plus me-1"></i> Create Student Account
                    </button>
                </form>

                <div class="mt-4 pt-3 border-top text-center">
                    <p class="small text-secondary mb-0">Already registered? <a href="{{ url_for('lms.login') }}" class="text-primary fw-semibold text-decoration-none">Sign in</a></p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
