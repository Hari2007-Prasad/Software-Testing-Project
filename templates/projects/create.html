{% extends "base.html" %}

{% block title %}Create Testing Project{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb mb-2">
                <li class="breadcrumb-item"><a href="{{ url_for('projects.index') }}">Projects</a></li>
                <li class="breadcrumb-item active">New Project</li>
            </ol>
        </nav>
        
        <div class="card-enterprise">
            <div class="card-header">
                <h5 class="fw-bold mb-0"><i class="fa-solid fa-plus-circle text-primary me-2"></i> Initialize New Testing Project</h5>
            </div>
            <div class="card-body">
                <form method="POST" action="{{ url_for('projects.create') }}">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>

                    <div class="mb-3">
                        <label class="form-label fw-bold small text-secondary">Project Name *</label>
                        <input type="text" name="name" class="form-control" placeholder="e.g. Canvas / Moodle Core LMS Regression" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold small text-secondary">Application Target URL *</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light text-muted"><i class="fa-solid fa-link"></i></span>
                            <input type="url" name="app_url" class="form-control" value="http://127.0.0.1:5000/lms" required>
                        </div>
                        <small class="text-muted">Target web application endpoint that Selenium tests and security scans will audit.</small>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-md-4">
                            <label class="form-label fw-bold small text-secondary">Project Type</label>
                            <select name="project_type" class="form-select">
                                <option value="Digital Learning Platform" selected>Digital Learning Platform</option>
                                <option value="Web Portal LMS">Web Portal LMS</option>
                                <option value="Educational SaaS">Educational SaaS</option>
                                <option value="Enterprise Web App">Enterprise Web App</option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-bold small text-secondary">Environment</label>
                            <select name="environment" class="form-select">
                                <option value="Development">Development</option>
                                <option value="Staging" selected>Staging</option>
                                <option value="Production">Production</option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-bold small text-secondary">Status</label>
                            <select name="status" class="form-select">
                                <option value="Active" selected>Active</option>
                                <option value="Archived">Archived</option>
                                <option value="Completed">Completed</option>
                            </select>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-bold small text-secondary">Description & Testing Scope</label>
                        <textarea name="description" class="form-control" rows="4" placeholder="Detail the objectives, application version, architecture notes, and primary test goals..."></textarea>
                    </div>

                    <div class="d-flex justify-content-between align-items-center pt-3 border-top">
                        <a href="{{ url_for('projects.index') }}" class="btn btn-outline-secondary rounded-pill px-4">Cancel</a>
                        <button type="submit" class="btn btn-primary rounded-pill px-5 shadow-sm">
                            <i class="fa-solid fa-check me-1"></i> Initialize Project
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
