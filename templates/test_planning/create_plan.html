{% extends "base.html" %}

{% block title %}Create Test Plan{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-9">
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb mb-2">
                <li class="breadcrumb-item"><a href="{{ url_for('test_planning.index') }}">Test Planning</a></li>
                <li class="breadcrumb-item active">New Plan</li>
            </ol>
        </nav>

        <div class="card-enterprise">
            <div class="card-header">
                <h5 class="fw-bold mb-0"><i class="fa-solid fa-file-circle-plus text-primary me-2"></i> Define New Test Plan</h5>
            </div>
            <div class="card-body">
                <form method="POST" action="{{ url_for('test_planning.create_plan') }}">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>

                    <div class="row g-3 mb-3">
                        <div class="col-md-7">
                            <label class="form-label fw-bold small text-secondary">Target Project *</label>
                            <select name="project_id" class="form-select" required>
                                {% for p in projects %}
                                <option value="{{ p.id }}" {% if request.args.get('project_id', type=int) == p.id %}selected{% endif %}>{{ p.name }} ({{ p.environment }})</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-5">
                            <label class="form-label fw-bold small text-secondary">Assigned Tester</label>
                            <select name="assigned_tester_id" class="form-select">
                                <option value="">Select QA Engineer...</option>
                                {% for u in testers %}
                                <option value="{{ u.id }}" {% if current_user.id == u.id %}selected{% endif %}>{{ u.full_name or u.username }} ({{ u.role }})</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold small text-secondary">Test Plan Name *</label>
                        <input type="text" name="name" class="form-control" placeholder="e.g. Sprint 24 Regression & Security Audit Plan" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold small text-secondary">Plan Description</label>
                        <textarea name="description" class="form-control" rows="2" placeholder="Summary of what this plan verifies..."></textarea>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label class="form-label fw-bold small text-secondary">Testing Objectives</label>
                            <textarea name="objectives" class="form-control" rows="3" placeholder="Core quality objectives and acceptance criteria..."></textarea>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold small text-secondary">Scope of Testing</label>
                            <textarea name="scope" class="form-control" rows="3" placeholder="Functional areas in scope and out of scope..."></textarea>
                        </div>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-md-4">
                            <label class="form-label fw-bold small text-secondary">Environment</label>
                            <select name="environment" class="form-select">
                                <option value="Development">Development</option>
                                <option value="Staging" selected>Staging</option>
                                <option value="Production">Production</option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-bold small text-secondary">Start Date</label>
                            <input type="date" name="start_date" class="form-control">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-bold small text-secondary">End Date</label>
                            <input type="date" name="end_date" class="form-control">
                        </div>
                    </div>

                    <div class="row g-3 mb-4">
                        <div class="col-md-4">
                            <label class="form-label fw-bold small text-secondary">Test Strategy</label>
                            <input type="text" name="test_strategy" class="form-control" placeholder="Automated + CV + OWASP">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-bold small text-secondary">Entry Criteria</label>
                            <input type="text" name="entry_criteria" class="form-control" placeholder="Build deployed, DB seeded">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-bold small text-secondary">Exit Criteria</label>
                            <input type="text" name="exit_criteria" class="form-control" placeholder=">= 95% pass, 0 critical defects">
                        </div>
                    </div>

                    <div class="d-flex justify-content-between align-items-center pt-3 border-top">
                        <a href="{{ url_for('test_planning.index') }}" class="btn btn-outline-secondary rounded-pill px-4">Cancel</a>
                        <button type="submit" class="btn btn-primary rounded-pill px-5 shadow-sm">
                            <i class="fa-solid fa-check me-1"></i> Save Test Plan
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
