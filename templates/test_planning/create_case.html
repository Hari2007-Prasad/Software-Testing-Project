{% extends "base.html" %}

{% block title %}Add Test Case - {{ plan.name }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-9">
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb mb-2">
                <li class="breadcrumb-item"><a href="{{ url_for('test_planning.index') }}">Test Planning</a></li>
                <li class="breadcrumb-item"><a href="{{ url_for('test_planning.plan_details', plan_id=plan.id) }}">{{ plan.name }}</a></li>
                <li class="breadcrumb-item active">New Test Case</li>
            </ol>
        </nav>

        <div class="card-enterprise">
            <div class="card-header">
                <h5 class="fw-bold mb-0"><i class="fa-solid fa-plus-circle text-primary me-2"></i> Add Test Case Specification</h5>
            </div>
            <div class="card-body">
                <form method="POST" action="{{ url_for('test_planning.create_case', plan_id=plan.id) }}">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>

                    <div class="row g-3 mb-3">
                        <div class="col-md-4">
                            <label class="form-label fw-bold small text-secondary">Unique Test Case ID *</label>
                            <input type="text" name="custom_id" value="{{ suggested_id }}" class="form-control font-monospace" placeholder="TC-001" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-bold small text-secondary">Module / Subsystem *</label>
                            <input type="text" name="module" value="Authentication" class="form-control" placeholder="e.g. Authentication" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-bold small text-secondary">Test Category *</label>
                            <select name="category" class="form-select">
                                <option value="Functional Testing" selected>Functional Testing</option>
                                <option value="Security Testing">Security Testing</option>
                                <option value="UI Testing">UI Testing</option>
                                <option value="Validation Testing">Validation Testing</option>
                                <option value="Authentication">Authentication</option>
                                <option value="Authorization Testing">Authorization Testing</option>
                                <option value="Image Comparison Testing">Image Comparison Testing</option>
                            </select>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold small text-secondary">Test Case Title *</label>
                        <input type="text" name="title" class="form-control" placeholder="e.g. Verify Student Successful Login with Valid Credentials" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold small text-secondary">Preconditions</label>
                        <input type="text" name="preconditions" class="form-control" placeholder="e.g. Registered active student user account exists; application reachable.">
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold small text-secondary">Execution Steps *</label>
                        <textarea name="steps" class="form-control font-monospace small" rows="4" placeholder="1. Navigate to /lms/login&#10;2. Enter student username and valid password&#10;3. Click Login button" required></textarea>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label class="form-label fw-bold small text-secondary">Test Data</label>
                            <textarea name="test_data" class="form-control font-monospace small" rows="2" placeholder="username: student&#10;password: student123"></textarea>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold small text-secondary">Expected Result *</label>
                            <textarea name="expected_result" class="form-control small" rows="2" placeholder="User is authenticated and redirected to student dashboard." required></textarea>
                        </div>
                    </div>

                    <div class="row g-3 mb-4">
                        <div class="col-md-4">
                            <label class="form-label fw-bold small text-secondary">Priority</label>
                            <select name="priority" class="form-select">
                                <option value="Low">Low</option>
                                <option value="Medium" selected>Medium</option>
                                <option value="High">High</option>
                                <option value="Critical">Critical</option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-bold small text-secondary">Severity</label>
                            <select name="severity" class="form-select">
                                <option value="Minor">Minor</option>
                                <option value="Major" selected>Major</option>
                                <option value="Critical">Critical</option>
                                <option value="Blocker">Blocker</option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-bold small text-secondary">Assign Tester</label>
                            <select name="tester_id" class="form-select">
                                {% for u in testers %}
                                <option value="{{ u.id }}" {% if current_user.id == u.id %}selected{% endif %}>{{ u.full_name or u.username }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>

                    <div class="d-flex justify-content-between align-items-center pt-3 border-top">
                        <a href="{{ url_for('test_planning.plan_details', plan_id=plan.id) }}" class="btn btn-outline-secondary rounded-pill px-4">Cancel</a>
                        <button type="submit" class="btn btn-primary rounded-pill px-5 shadow-sm">
                            <i class="fa-solid fa-check me-1"></i> Save Test Case
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
